name: Update Supabase Loto

on:
  workflow_dispatch:
    inputs:
      data_extragere:
        description: 'Data (YYYY-MM-DD)'
        required: true
        default: '2026-06-21'
      numere:
        description: 'Cele 6 numere separate prin virgulă (ex: 3,5,7,10,18,25)'
        required: true

jobs:
  update_db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalare Dependențe
        run: |
          pip install requests supabase

      - name: Executare Script Update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python .github/scripts/update_database.py "${{ github.event.inputs.data_extragere }}" "${{ github.event.inputs.numere }}"
