name: Update Supabase Loto

on:
  workflow_dispatch:
    inputs:
      tip_joc:
        type: choice
        description: 'Alege tipul de joc'
        required: true
        options:
          - '6/49'
          - '5/40'
          - 'Joker'
      data_extragere:
        description: 'Data (YYYY-MM-DD)'
        required: true
        default: '2026-06-21'
      numere:
        description: 'Numerele (Ex 6/49: 3,5,7... | Ex Joker: 1,2,3,4,5 + 20)'
        required: true

jobs:
  update_db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalare Dependențe
        run: |
          pip install requests

      - name: Executare Script Update
        run: |
          python .github/scripts/update_database.py "${{ github.event.inputs.tip_joc }}" "${{ github.event.inputs.data_extragere }}" "${{ github.event.inputs.numere }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
