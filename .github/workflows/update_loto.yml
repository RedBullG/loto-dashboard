jobs:
  update_db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalare Dependențe
        run: |
          pip install requests

      - name: Executare Script Update
        run: |
          # Curățăm direct în variabile Bash și le trimitem ca argumente 4 și 5
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n ')
          CLEAN_KEY=$(echo "${{ secrets.SUPABASE_KEY }}" | tr -d '\r\n ')
          
          python .github/scripts/update_database.py \
            "${{ github.event.inputs.tip_joc }}" \
            "${{ github.event.inputs.data_extragere }}" \
            "${{ github.event.inputs.numere }}" \
            "$CLEAN_URL" \
            "$CLEAN_KEY"
